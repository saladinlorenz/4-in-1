<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- 32x32 pixel art smol crab -->

  <!-- Left arm (short, 2px) -->
  <rect x="8" y="11" width="1" height="1" fill="#ff6b4a"/>
  <rect x="7" y="10" width="1" height="1" fill="#ff6b4a"/>

  <!-- Left claw - two prongs with gap, pointing up -->
  <!-- outer prong -->
  <rect x="4" y="6" width="1" height="1" fill="#ff8a6a"/>
  <rect x="4" y="7" width="1" height="1" fill="#ff8a6a"/>
  <rect x="5" y="8" width="1" height="1" fill="#ff6b4a"/>
  <rect x="6" y="9" width="1" height="1" fill="#ff6b4a"/>
  <!-- inner prong -->
  <rect x="6" y="6" width="1" height="1" fill="#e55539"/>
  <rect x="6" y="7" width="1" height="1" fill="#e55539"/>
  <rect x="6" y="8" width="1" height="1" fill="#ff6b4a"/>
  <!-- gap between prongs at (5,6) and (5,7) is empty -->

  <!-- Right arm (short, 2px) -->
  <rect x="23" y="11" width="1" height="1" fill="#ff6b4a"/>
  <rect x="24" y="10" width="1" height="1" fill="#ff6b4a"/>

  <!-- Right claw - two prongs with gap, pointing up -->
  <!-- outer prong -->
  <rect x="27" y="6" width="1" height="1" fill="#ff8a6a"/>
  <rect x="27" y="7" width="1" height="1" fill="#ff8a6a"/>
  <rect x="26" y="8" width="1" height="1" fill="#ff6b4a"/>
  <rect x="25" y="9" width="1" height="1" fill="#ff6b4a"/>
  <!-- inner prong -->
  <rect x="25" y="6" width="1" height="1" fill="#e55539"/>
  <rect x="25" y="7" width="1" height="1" fill="#e55539"/>
  <rect x="25" y="8" width="1" height="1" fill="#ff6b4a"/>

  <!-- Body -->
  <rect x="11" y="10" width="10" height="1" fill="#ff8a6a"/>
  <rect x="9" y="11" width="14" height="1" fill="#ff6b4a"/>
  <rect x="9" y="12" width="14" height="1" fill="#ff6b4a"/>
  <rect x="8" y="13" width="16" height="1" fill="#ff6b4a"/>
  <rect x="8" y="14" width="16" height="1" fill="#e55539"/>
  <rect x="8" y="15" width="16" height="1" fill="#e55539"/>
  <rect x="9" y="16" width="14" height="1" fill="#e55539"/>
  <rect x="9" y="17" width="14" height="1" fill="#d44429"/>
  <rect x="10" y="18" width="12" height="1" fill="#d44429"/>
  <rect x="11" y="19" width="10" height="1" fill="#d44429"/>

  <!-- Eyes -->
  <rect x="12" y="12" width="2" height="2" fill="#1a1a2e"/>
  <rect x="18" y="12" width="2" height="2" fill="#1a1a2e"/>
  <rect x="12" y="12" width="1" height="1" fill="white"/>
  <rect x="18" y="12" width="1" height="1" fill="white"/>

  <!-- Smile -->
  <rect x="14" y="16" width="4" height="1" fill="#1a1a2e"/>

  <!-- Left legs - 3, from body sides -->
  <rect x="7" y="13" width="1" height="1" fill="#d44429"/>
  <rect x="6" y="14" width="1" height="1" fill="#d44429"/>
  <rect x="5" y="15" width="1" height="1" fill="#c03a1f"/>
  <rect x="4" y="16" width="1" height="1" fill="#c03a1f"/>

  <rect x="7" y="15" width="1" height="1" fill="#d44429"/>
  <rect x="6" y="16" width="1" height="1" fill="#d44429"/>
  <rect x="5" y="17" width="1" height="1" fill="#c03a1f"/>
  <rect x="4" y="18" width="1" height="1" fill="#c03a1f"/>

  <rect x="8" y="17" width="1" height="1" fill="#d44429"/>
  <rect x="7" y="18" width="1" height="1" fill="#d44429"/>
  <rect x="6" y="19" width="1" height="1" fill="#c03a1f"/>
  <rect x="5" y="20" width="1" height="1" fill="#c03a1f"/>

  <!-- Right legs - 3, from body sides -->
  <rect x="24" y="13" width="1" height="1" fill="#d44429"/>
  <rect x="25" y="14" width="1" height="1" fill="#d44429"/>
  <rect x="26" y="15" width="1" height="1" fill="#c03a1f"/>
  <rect x="27" y="16" width="1" height="1" fill="#c03a1f"/>

  <rect x="24" y="15" width="1" height="1" fill="#d44429"/>
  <rect x="25" y="16" width="1" height="1" fill="#d44429"/>
  <rect x="26" y="17" width="1" height="1" fill="#c03a1f"/>
  <rect x="27" y="18" width="1" height="1" fill="#c03a1f"/>

  <rect x="23" y="17" width="1" height="1" fill="#d44429"/>
  <rect x="24" y="18" width="1" height="1" fill="#d44429"/>
  <rect x="25" y="19" width="1" height="1" fill="#c03a1f"/>
  <rect x="26" y="20" width="1" height="1" fill="#c03a1f"/>
</svg>
